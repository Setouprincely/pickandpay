name: DOCH Backend CI/CD
on:
  push:
    branches:
      - main

permissions:
  contents: read
env:
  APP_NAME: doch
  AWS_REGION: ${{ secrets.AWS_REGION }}
  S3_BUCKET: ${{ secrets.S3_BUCKET }}

jobs:
  deploy:

    name: Build & Deploy Backend

    runs-on: ubuntu-latest

    steps:

      ####################################################
      # Checkout Source
      ####################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ####################################################
      # Setup Java
      ####################################################

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'
          cache: maven

      ####################################################
      # Build Application
      ####################################################

      - name: Build Application
        run: |
          mvn clean package -DskipTests

      ####################################################
      # Locate JAR
      ####################################################

      - name: Locate JAR
        id: jar
        run: |

          JAR=$(find target \
          -maxdepth 1 \
          -name "*.jar" \
          ! -name "*sources.jar" \
          ! -name "*javadoc.jar" \
          | head -n1)

          if [ -z "$JAR" ]; then
            echo "Executable JAR not found."
            exit 1
          fi

          echo "jar=$JAR" >> $GITHUB_OUTPUT

      ####################################################
      # Generate Version
      ####################################################

      - name: Generate Version
        id: version
        run: |

          VERSION=$(date +"%Y%m%d-%H%M%S")-${GITHUB_SHA::7}

          echo "VERSION=$VERSION" >> $GITHUB_ENV

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      ####################################################
      # Configure AWS Credentials
      ####################################################

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      ####################################################
      # Upload Artifact
      ####################################################

      - name: Upload JAR to S3

        run: |

          aws s3 cp \
          "${{ steps.jar.outputs.jar }}" \
          "s3://${{ secrets.S3_BUCKET }}/backend/releases/${{ steps.version.outputs.version }}/doch.jar"

      ####################################################
      # Deploy Through SSM
      ####################################################

      - name: Deploy to EC2

        id: deploy

        run: |

          COMMAND_ID=$(aws ssm send-command \
          --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
          --document-name "AWS-RunShellScript" \
          --comment "Deploy DOCH Backend ${{ steps.version.outputs.version }}" \
          --parameters commands="[\"sudo /opt/doch/scripts/deploy.sh ${{ steps.version.outputs.version }}\"]" \
          --query "Command.CommandId" \
          --output text)

          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
          --command-id $COMMAND_ID \
          --instance-id "${{ secrets.EC2_INSTANCE_ID }}" || true
          
          aws ssm get-command-invocation \
          --command-id $COMMAND_ID \
          --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

      ####################################################
      # Deployment Finished
      ####################################################

      - name: Finished

        run: |

          echo "DOCH BACKEND Deployment Successful "

          echo "Version : ${{ steps.version.outputs.version }}"
