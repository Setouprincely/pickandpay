services:
  # The PostgreSQL Database Service
  db:
    # Use the latest official stable version: 18
    image: postgres:18
    container_name: doch-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Mount to the parent directory, as required by newer PostgreSQL images
      - db-data:/var/lib/postgresql
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # The Spring Boot Application Service
  app:
    container_name: doch-app
    build: .
    ports:
      - "${APP_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      # Frontend URLs
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:5174}
      APP_MARKET_FRONTEND_URL: ${APP_MARKET_FRONTEND_URL}
      APP_MARKET_PAYMENT_REDIRECT_URL: ${APP_MARKET_PAYMENT_REDIRECT_URL}
      APP_XENDER_FRONTEND_URL: ${APP_XENDER_FRONTEND_URL}
      APP_XENDER_PAYMENT_REDIRECT_URL: ${APP_XENDER_PAYMENT_REDIRECT_URL}
      APP_DRIVER_FRONTEND_URL: ${APP_DRIVER_FRONTEND_URL:-http://localhost:3001}
      APP_ADMIN_FRONTEND_URL: ${APP_ADMIN_FRONTEND_URL:-http://localhost:3000}
      STAFF_INVITE_EXPIRY_HOURS: ${STAFF_INVITE_EXPIRY_HOURS:-72}
      AUTH_AUTO_VERIFY: ${AUTH_AUTO_VERIFY:-false}
      BOOTSTRAP_SUPER_ADMIN_EMAIL: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:-superadmin@doch.com}
      BOOTSTRAP_SUPER_ADMIN_PASSWORD: ${BOOTSTRAP_SUPER_ADMIN_PASSWORD:-}
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # Fapshi: all three are required (FAPSHI_API_USER and FAPSHI_BASE_URL
      # were previously missing here, which breaks payment initiation when
      # running inside Docker even though it works with local bootRun).
      FAPSHI_API_USER: ${FAPSHI_API_USER}
      FAPSHI_API_KEY: ${FAPSHI_API_KEY}
      FAPSHI_BASE_URL: ${FAPSHI_BASE_URL}
      FAPSHI_WEBHOOK_SECRET: ${FAPSHI_WEBHOOK_SECRET:-}
      # Inside Docker, use the service name instead of localhost.
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      RESEND_API_KEY: ${RESEND_API_KEY}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GEO_PROVIDER: ${GEO_PROVIDER:-google}

    restart: on-failure

  # (Optional but Recommended) A web GUI for the database
  adminer:
    image: adminer
    container_name: doch-adminer
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db-data:
