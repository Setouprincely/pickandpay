<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Package update</title>
    <meta charset="UTF-8">
</head>
<body style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f4; color: #333333;">
<div style="max-width: 600px; margin: auto; background-color: #ffffff; border-radius: 12px; padding: 32px;">
    <h2 style="color: #c00000; margin-top: 0;" th:text="${statusText}">Status</h2>
    <p>Hello <strong th:text="${name}">Customer</strong>,</p>
    <p>Package <strong th:text="${tracking}">DCH-XXXX</strong>
        <span th:if="${orderReference}"> (order <strong th:text="${orderReference}">DO-XXXX</strong>)</span>:</p>
    <p th:text="${detail}">Detail</p>
    <div th:if="${otp}" style="text-align:center; margin: 20px 0;">
        <div style="font-size: 13px; color:#666;">Your delivery code</div>
        <div style="font-size: 30px; font-weight: bold; letter-spacing: 6px; color:#c00000;" th:text="${otp}">000000</div>
    </div>
    <p><a th:href="${trackUrl}" style="color:#c00000;">Track this package</a></p>
    <p th:if="${reviewUrl}"><a th:href="${reviewUrl}" style="background:#c00000; color:#fff; padding:10px 22px; border-radius:6px; text-decoration:none; display:inline-block;">Rate your order</a></p>
    <p style="font-size: 12px; color: #aaa;">DOCH Logistics - All roads lead home</p>
</div>
</body>
</html>
